<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MiniPlay</title>
<style>body{font:16px system-ui;background:#151929;color:white;margin:0;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);text-align:center}main{max-width:500px;margin:auto}button,input,select{font:inherit;padding:12px;margin:8px;border-radius:8px}button{background:#71e5bb;border:0}#target{display:block;width:160px;height:160px;margin:30px auto;border-radius:50%;background:#555;touch-action:manipulation}#target.active{background:#f4c75d}pre{text-align:left;white-space:pre-wrap}</style>
<main><h1>MiniPlay</h1><label>User <input id="user" value="player1" maxlength="40"></label><label>Game <select id="game"><option value="rhythm">Rhythm Tap</option><option value="reflex">Reflex Tap</option></select></label><p>Tap the circle when it lights up. Each run lasts 10 seconds.</p><button id="start">Start run</button><button id="target" aria-label="Tap target" disabled></button><p id="status">Ready</p><h2>Leaderboard</h2><pre id="board"></pre></main><script src="game.js"></script></html>
