openapi: 3.1.0
info:
  title: MiniPlay local API
  version: 0.6.0
  description: >-
    Gateway contract for the local prototype. User names are demo identities;
    the player routes do not authenticate accounts and this API is not ready for
    public deployment. Signed run tokens bind each score to a server-issued game,
    seed, user and expiry. The admin routes need one shared local demo bearer
    token, checked by the admin service on every request.
servers:
  - url: http://127.0.0.1:8080
    description: Local Go gateway
  - url: https://127.0.0.1:8080
    description: Local Go gateway with MINIPLAY_TLS_CERT and MINIPLAY_TLS_KEY set (HTTPS only)
paths:
  /api/health:
    get:
      summary: Check that the gateway process is answering
      operationId: gatewayHealth
      responses:
        '200':
          description: Gateway handler is available; dependencies are not checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/sessions:
    post:
      summary: Start a game run
      operationId: createSession
      description: >-
        A shared Redis token bucket limits requests by remote IP. The response
        exposes the seed so the client can draw deterministic targets. A bot
        can also use it; score replay alone cannot prove human play.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: A signed run token valid for 120 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/scores:
    post:
      summary: Submit one run for authoritative replay
      operationId: submitScore
      description: >-
        The claimed score is the base replay score, never the multiplied one.
        After replay accepts it, the flag state the score service holds at
        submission decides the multiplier; the state when the run was signed
        does not count. That state is at most MINIPLAY_FLAG_TTL old (default
        5 s, maximum 60 s). If it cannot be read the service answers 503 and the
        token stays usable. An accepted or rejected attempt consumes the run ID
        once in PostgreSQL. A second submission returns 409 and changes nothing.
        Successful SQL persistence is authoritative even if Redis cache update
        fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '200':
          description: Accepted and durably recorded score.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired run token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This run ID already has an accepted or rejected attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Token was valid, but duration, input sequence, or claimed score
            failed replay validation. The rejected attempt is durable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/leaderboards:
    get:
      summary: Read a top-20 board and optional caller rank
      operationId: getLeaderboard
      description: >-
        Daily and weekly periods are UTC calendar windows; weekly begins on
        Monday. Global, daily and weekly boards use Redis with SQL backfill
        and fallback. The friends board always reads SQL and requires user.
        A missing myRank is returned as JSON null.
      parameters:
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/BoardPeriod'
        - $ref: '#/components/parameters/User'
      responses:
        '200':
          description: Top 20 users and one-based rank for the requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/boards/live:
    get:
      summary: Stream a leaderboard over WebSocket
      operationId: watchLeaderboard
      description: >-
        Requires a WebSocket Upgrade request. Global, daily and weekly boards
        are supported; friends is not. The server sends an initial board
        snapshot, then new snapshots after Redis pub/sub notifications.
        It sends WebSocket pings every 25 seconds. Reconnect after closure.
      parameters:
        - $ref: '#/components/parameters/Game'
        - $ref: '#/components/parameters/LivePeriod'
        - $ref: '#/components/parameters/User'
      responses:
        '101':
          description: Switching Protocols; subsequent frames use LiveBoardMessage.
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          description: Only GET is allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-websocket-message:
        $ref: '#/components/schemas/LiveBoardMessage'
  /api/admin/games:
    get:
      summary: List games with their double-points flag
      operationId: adminGames
      security:
        - adminToken: []
      responses:
        '200':
          description: Current flags and the longest a score service may keep using an old one.
          content:
            application/json:
              schema:
                type: object
                required: [games, flagMaxStalenessSeconds]
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminGame'
                  flagMaxStalenessSeconds:
                    type: number
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/admin/games/{game}/double-points:
    put:
      summary: Turn a game's double points on or off
      operationId: adminSetDoublePoints
      description: >-
        Changes the flag and writes one audit row in the same transaction. The
        actor in that row comes from server configuration, not the request.
        Setting the value it already holds returns changed=false and writes no row.
      security:
        - adminToken: []
      parameters:
        - name: game
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Game'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [doublePoints, expectedVersion]
              properties:
                doublePoints:
                  type: boolean
                expectedVersion:
                  type: integer
                  description: The flag version the admin was looking at.
      responses:
        '200':
          description: The flag after the request.
          content:
            application/json:
              schema:
                type: object
                required: [flag, changed, flagMaxStalenessSeconds]
                properties:
                  flag:
                    $ref: '#/components/schemas/Flag'
                  changed:
                    type: boolean
                  flagMaxStalenessSeconds:
                    type: number
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '404':
          description: Unknown game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: expectedVersion is stale. Nothing changed; the body holds the current flag.
          content:
            application/json:
              schema:
                type: object
                required: [error, flag]
                properties:
                  error:
                    type: string
                  flag:
                    $ref: '#/components/schemas/Flag'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/admin/stats:
    get:
      summary: Read live figures, labelled by source
      operationId: adminStats
      description: >-
        games, outboxPending and oldestPendingAt are direct SQL reads over the last
        24 hours. aggregates comes from daily_stats, which only moves while the
        outbox publisher, Kafka and the stats worker are running.
      security:
        - adminToken: []
      responses:
        '200':
          description: Live figures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStats'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/admin/flagged-runs:
    get:
      summary: List runs the offline scan raised for review
      operationId: adminFlaggedRuns
      description: These are review signals with their evidence, not cheating verdicts.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Raised runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlaggedRun'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/admin/runs/{runId}:
    get:
      summary: Explain one accepted score
      operationId: adminExplainRun
      security:
        - adminToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The stored numbers and the audit row behind their flag version, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunExplanation'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '404':
          description: No accepted run has that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
  /api/admin/audit:
    get:
      summary: Read the append-only audit log, newest first
      operationId: adminAudit
      description: This is the only audit route. Other methods return 405.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          description: Return entries with an ID below this one.
          schema:
            type: integer
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/AdminUnauthorized'
        '503':
          $ref: '#/components/responses/AdminUnavailable'
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: >-
        One shared local demo token from MINIPLAY_ADMIN_TOKEN, compared in constant
        time on the server. The admin service will not start without it.
  parameters:
    Game:
      name: game
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/Game'
    BoardPeriod:
      name: period
      in: query
      required: false
      description: Defaults to all; friends requires a nonempty user parameter.
      schema:
        type: string
        enum: [all, daily, weekly, friends]
        default: all
    LivePeriod:
      name: period
      in: query
      required: false
      description: Defaults to all.
      schema:
        $ref: '#/components/schemas/LivePeriod'
    User:
      name: user
      in: query
      required: false
      description: Demo identity used only for myRank or the friends filter.
      schema:
        $ref: '#/components/schemas/User'
  responses:
    AdminUnauthorized:
      description: The bearer token is missing or wrong.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminUnavailable:
      description: The token is not configured on the handler, or the database could not answer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid JSON, query, user or game.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Redis token bucket rejected this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A required cache or SQL operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Game:
      type: string
      enum: [rhythm, reflex]
    LivePeriod:
      type: string
      enum: [all, daily, weekly]
      default: all
    User:
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[A-Za-z0-9_-]+$'
    Tap:
      type: object
      additionalProperties: false
      required: [ms, x, y]
      properties:
        ms:
          type: integer
          minimum: 0
          maximum: 10250
          description: Milliseconds from run start.
        x:
          type: integer
          minimum: 0
          maximum: 1000
        y:
          type: integer
          minimum: 0
          maximum: 1000
    SessionRequest:
      type: object
      additionalProperties: false
      required: [user, game]
      properties:
        user:
          $ref: '#/components/schemas/User'
        game:
          $ref: '#/components/schemas/Game'
    Session:
      type: object
      required: [token, runId, seed, expiresAt]
      properties:
        token:
          type: string
          description: HMAC-signed base64url claims and signature.
        runId:
          type: string
        seed:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: Unix milliseconds.
    ScoreSubmission:
      type: object
      additionalProperties: false
      required: [token, events, score, durationMs]
      properties:
        token:
          type: string
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tap'
        score:
          type: integer
          minimum: 0
          maximum: 195
          description: >-
            The base score the client computed, which replay must match. Claiming
            a multiplied score is a mismatch. The request cannot carry a multiplier.
        durationMs:
          type: integer
          minimum: 9500
          maximum: 12000
    Score:
      type: object
      required: [runId, user, game, score, baseScore, multiplier, flagVersion, durationMs, submittedAt]
      properties:
        runId:
          type: string
        user:
          $ref: '#/components/schemas/User'
        game:
          $ref: '#/components/schemas/Game'
        score:
          type: integer
          minimum: 0
          maximum: 390
          description: The final score, equal to baseScore times multiplier.
        baseScore:
          type: integer
          minimum: 0
          maximum: 195
          description: The score replay validated.
        multiplier:
          type: integer
          enum: [1, 2]
        flagVersion:
          type: integer
          minimum: 0
          description: The feature_flags version that decided the multiplier.
        durationMs:
          type: integer
        submittedAt:
          type: string
          format: date-time
    Flag:
      type: object
      required: [game, doublePoints, version, updatedAt]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        doublePoints:
          type: boolean
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    AdminGame:
      type: object
      required: [id, title, flag]
      properties:
        id:
          $ref: '#/components/schemas/Game'
        title:
          type: string
        flag:
          $ref: '#/components/schemas/Flag'
    GameLiveStats:
      type: object
      required: [game, accepted, rejected, doubled, players, lastAcceptedAt]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        accepted:
          type: integer
        rejected:
          type: integer
        doubled:
          type: integer
          description: Accepted runs with a multiplier above 1.
        players:
          type: integer
        lastAcceptedAt:
          type: [string, 'null']
          format: date-time
    DailyStat:
      type: object
      required: [game, day, accepted, rejected, scoreSum, medianScore]
      properties:
        game:
          $ref: '#/components/schemas/Game'
        day:
          type: string
          format: date-time
        accepted:
          type: integer
        rejected:
          type: integer
        scoreSum:
          type: integer
          description: Includes the double-points multiplier.
        medianScore:
          type: number
          description: Includes the double-points multiplier.
    LiveStats:
      type: object
      required: [generatedAt, windowStart, games, outboxPending, oldestPendingAt, aggregates]
      properties:
        generatedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameLiveStats'
        outboxPending:
          type: integer
        oldestPendingAt:
          type: [string, 'null']
          format: date-time
        aggregates:
          type: array
          items:
            $ref: '#/components/schemas/DailyStat'
    FlaggedRun:
      type: object
      required: [runId, user, game, isolationScore, zScore, reasons, evidence, flaggedAt, score, baseScore, multiplier]
      properties:
        runId:
          type: string
        user:
          $ref: '#/components/schemas/User'
        game:
          $ref: '#/components/schemas/Game'
        isolationScore:
          type: number
        zScore:
          type: number
          description: Computed on base scores.
        reasons:
          type: array
          items:
            type: string
        evidence:
          type: object
          additionalProperties:
            type: number
        flaggedAt:
          type: string
          format: date-time
        score:
          type: integer
        baseScore:
          type: integer
        multiplier:
          type: integer
    AuditEntry:
      type: object
      required: [id, actor, action, game, before, after, details, at]
      properties:
        id:
          type: integer
        actor:
          type: string
          description: The server's configured name for the shared token, not a verified person.
        action:
          type: string
        game:
          $ref: '#/components/schemas/Game'
        before:
          type: object
        after:
          type: object
        details:
          type: object
          additionalProperties:
            type: string
        at:
          type: string
          format: date-time
    RunExplanation:
      type: object
      required: [runId, user, game, score, baseScore, multiplier, flagVersion, durationMs, submittedAt, flagChange]
      properties:
        runId:
          type: string
        user:
          $ref: '#/components/schemas/User'
        game:
          $ref: '#/components/schemas/Game'
        score:
          type: integer
        baseScore:
          type: integer
        multiplier:
          type: integer
        flagVersion:
          type: integer
          description: 0 means stored before flag versions existed; 1 is the initial off state.
        durationMs:
          type: integer
        submittedAt:
          type: string
          format: date-time
        flagChange:
          description: The audit row that produced flagVersion. Null for versions 0 and 1.
          oneOf:
            - $ref: '#/components/schemas/AuditEntry'
            - type: 'null'
    Leader:
      type: object
      required: [user, score]
      properties:
        user:
          $ref: '#/components/schemas/User'
        score:
          type: integer
          minimum: 0
    Board:
      type: object
      required: [leaders, myRank]
      properties:
        leaders:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Leader'
        myRank:
          type: [integer, 'null']
          minimum: 1
    LiveBoardMessage:
      type: object
      required: [type, game, period, board]
      properties:
        type:
          const: board
        game:
          $ref: '#/components/schemas/Game'
        period:
          $ref: '#/components/schemas/LivePeriod'
        board:
          $ref: '#/components/schemas/Board'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          const: ok
