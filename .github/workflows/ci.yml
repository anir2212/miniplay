# GitHub Actions first passed on PR #7 on 11 November 2026. See RESULTS.md
# for the saved check metadata and the remaining runtime limits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: miniplay
          POSTGRES_DB: miniplay_it
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miniplay"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests with the race detector
        run: go test -race ./...
      - name: Opt-in PostgreSQL and Redis integration tests
        # One package at a time: the flag rows and Redis keys are shared. A fresh
        # service database matches what these tests require.
        run: go test -p 1 -count=1 ./internal/store ./internal/httpapi -run Integration -v
        env:
          MINIPLAY_TEST_DATABASE_URL: postgres://miniplay@127.0.0.1:5432/miniplay_it?sslmode=disable
          MINIPLAY_TEST_REDIS_URL: redis://127.0.0.1:6379/15

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Game rules and portal component tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Game-start smoke test in Chrome
        run: npm run test:e2e

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Lint, render and check the chart
        run: scripts/check_chart.sh helm

  images:
    runs-on: ubuntu-latest
    needs: [lint, go-test, web, chart]
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, session-svc, score-svc, leaderboard-svc, admin-svc, outbox-publisher, stats-worker, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build, without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: miniplay/${{ matrix.service }}:ci
          push: false
